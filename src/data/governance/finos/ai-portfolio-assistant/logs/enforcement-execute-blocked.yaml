metadata:
  id: apa-enforcement-execute-blocked
  type: EnforcementLog
  version: "0.1.0"
  gemara-version: "1.2.0"
  draft: true
  date: "2026-09-11T11:15:04Z"
  description: >
    Enforcement after failed demo.SubmitOrders evaluation — DENY forward,
    notify compliance, preserve ISO 42001 / SoA evidence chain.
  author:
    id: apa-governance-runtime
    name: AI Portfolio Assistant Governance Runtime
    type: Software
    version: "0.1.0"
    uri: https://example.com/ai-governance/apa-runtime
  mapping-references:
    - id: apa-policy
      title: AI Portfolio Assistant Policy
      version: "0.2.0"
      url: file://../policy.yaml
    - id: apa-controls
      title: AI Portfolio Assistant Control Catalog
      version: "0.2.0"
      url: file://../control.yaml
    - id: apa-eval-execute-blocked
      title: Execute SubmitOrders Evaluation Log
      version: "0.1.0"
      url: file://evaluation-execute-blocked.yaml
    - id: apa-applicability-profile
      title: Statement of Applicability — AI Portfolio Assistant
      version: "0.2.0"
      url: file://../iso/applicability-profile.yaml

disposition: Enforced

target:
  id: apa-session-pm-execute-20260911-1115
  name: Portfolio Manager Execute Attempt Session
  type: Software
  uri: fdc3://desktop/ai-portfolio-assistant/sessions/pm-execute-20260911-1115
  environment: execute
  owner:
    name: Portfolio Manager
    affiliation: Investment Management
    email: portfolio.manager@example.com

actions:
  - disposition: Enforced
    method:
      reference-id: apa-policy
      entry-id: em-apa-block-execution
    message: >
      DENY: blocked demo.SubmitOrders for order list ORD-LIST-2026-09-11-1115.
      Desktop Agent did not forward the intent to Execution / Order Entry.
    start: "2026-09-11T11:15:04Z"
    end: "2026-09-11T11:15:05Z"
    steps:
      - apa/enforcement/fdc3.blockSubmitOrdersIntent
      - apa/enforcement/runtime.recordExecuteProhibitFailure
    justification:
      assessments:
        - result: Failed
          requirement:
            reference-id: apa-controls
            entry-id: apa-ctl-006-execute-prohibit.ar01
          plan:
            reference-id: apa-policy
            entry-id: ap-apa-006-execute-prohibit
          log:
            reference-id: apa-eval-execute-blocked
            entry-id: apa-ctl-006-execute-prohibit

  - disposition: Enforced
    method:
      reference-id: apa-policy
      entry-id: em-apa-block-authority-escalation
    message: >
      Recorded authority-escalation attempt from propose/recommend context to
      execute via demo.SubmitOrders on session
      apa-session-pm-execute-20260911-1115.
    start: "2026-09-11T11:15:05Z"
    end: "2026-09-11T11:15:06Z"
    steps:
      - apa/enforcement/runtime.recordAuthorityGateFailure
      - apa/enforcement/soa.citeControlDecision
    justification:
      assessments:
        - result: Failed
          requirement:
            reference-id: apa-controls
            entry-id: apa-ctl-006-execute-prohibit.ar01
          plan:
            reference-id: apa-policy
            entry-id: ap-apa-006-execute-prohibit
          log:
            reference-id: apa-eval-execute-blocked
            entry-id: apa-ctl-006-execute-prohibit

  - disposition: Enforced
    method:
      reference-id: apa-policy
      entry-id: em-apa-notify-compliance
    message: >
      Notified Compliance and AI Governance Office of blocked demo.SubmitOrders
      attempt; evidence retained for ISO/IEC 42001 demonstration (SoA
      soa-apa-ctl-006, AIMS scope exclusion autonomous-execution).
    start: "2026-09-11T11:15:06Z"
    end: "2026-09-11T11:15:07Z"
    steps:
      - apa/enforcement/notify.emailCompliance
      - apa/enforcement/notify.postAiGovernanceAlert
    justification:
      assessments:
        - result: Failed
          requirement:
            reference-id: apa-controls
            entry-id: apa-ctl-006-execute-prohibit.ar01
          plan:
            reference-id: apa-policy
            entry-id: ap-apa-006-execute-prohibit
          log:
            reference-id: apa-eval-execute-blocked
            entry-id: apa-ctl-006-execute-prohibit
