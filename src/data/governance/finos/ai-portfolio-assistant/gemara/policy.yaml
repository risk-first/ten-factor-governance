    users:
      - portfolio-managers
      - investment-analysts-authorized-to-use-assistant
    technologies:
      - ai-portfolio-assistant
      - fdc3-desktop
      - portfolio-applications
      - risk-and-exposure-applications
      - investment-research-applications
    groups:
      - investment-management-division
  out:
    technologies:
      - autonomous-trade-execution
      - retail-customer-facing-chatbots
      - model-training-pipelines
    groups:
      - retail-banking-ai-systems
      - non-investment-management-divisions

