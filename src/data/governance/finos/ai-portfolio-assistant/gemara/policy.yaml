    Policy governing use of the AI Portfolio Assistant across FDC3 desktop
    applications, including authority-ladder boundaries, human oversight for
    propose activity, and prohibition of autonomous trade execution. Composes
    FINOS AIGF guidance and CCC Managed Kubernetes host controls. Suitable
    for dual use as an ISO/IEC 42001-aligned AI policy statement.
