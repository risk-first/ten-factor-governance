title: AI Portfolio Assistant Control Catalog

metadata:
  id: apa-controls
  type: ControlCatalog
  version: "0.5.1"
  gemara-version: "1.2.0"
  draft: true
  date: "2026-11-01T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: >
    Incomplete catalog: only the control implemented by the runnable AIPA
    example (`examples/aipa`) is listed. That implementation intercepts
    demo.SubmitOrder at the Desktop Agent, asks a policy decision point
    whether the raise is attested by a trusted approving application, and
    holds the action for a first recorded human decision when it is not.
    That behaviour implements parts of FINOS AIGF AIR-PREV-018 (agent
    authority least privilege and approval-workflow enforcement),
    AIR-PREV-019 (human-in-the-loop on the execute tool), AIR-DET-011
    (recorded human decision), and AIR-DET-021 (evaluation and enforcement
    receipts). Authority-ladder, data-protection, tool-governance,
    explanation-grounding, model-supply, order-limit, and four-eyes
    controls that appear in policy, ISO/AIMS, and CALM remain design
    intent until they are implemented in the example.
  mapping-references:
    - id: apa-threats
      title: AI Portfolio Assistant Threat Catalog
      version: "0.3.0"
      url: file://threat.yaml
      description: >
        Layer 2 threats mitigated by these controls.
    - id: apa-guidance
      title: AI Portfolio Assistant Guidelines
      version: "0.2.0"
      url: file://../../guidance.yaml
      description: >
        Layer 1 guidance implemented by these controls.
    - id: FINOS-AIR
      title: FINOS AI Governance Framework
      version: "0.2.0"
      url: file://../../../../aigf/guidance.yaml
      description: >
        FINOS AIGF mitigations composed into the assistant governance model.
  applicability-groups:
    - id: propose
      title: Propose Authority
      description: >
        Applies when the assistant may construct proposed orders for human
        review.
    - id: execute
      title: Execute Authority
      description: >
        Applies to trade-execution capability; autonomous AI use is
        prohibited.
    - id: human-approval-required
      title: Human Approval Required
      description: >
        Applies when an agent-initiated path toward execution requires a
        first recorded human approval.

groups:
  - id: oversight
    title: Human Oversight
    description: >
      Controls that retain meaningful human review and approval for
      consequential actions.

imports:
  - reference-id: FINOS-AIR
    entries:
      - reference-id: AIR-PREV-018
        remarks: >
          Agent Authority Least Privilege — the assistant must not execute;
          demo.SubmitOrder proceeds only after a trusted approving
          application (or its attestation) performs the raise
          (AIR-PREV-018.4 approval-workflow enforcement).
      - reference-id: AIR-PREV-019
        remarks: >
          Tool Chain Validation — the execute intent is intercepted; the
          chain cannot complete unless it includes a human-approved,
          attested raise (AIR-PREV-019.3 human-in-the-loop / SoD).
      - reference-id: AIR-DET-011
        remarks: >
          Human Feedback Loop — first authorised human approve or refuse is
          recorded on the held GetApproval before the action is performed.
      - reference-id: AIR-DET-021
        remarks: >
          Agent Decision Audit — LogEvaluation / LogEnforcement receipts
          record who raised, what was evaluated, and the outcome.

controls:
  - id: apa-ctl-005-propose-human-approval
    title: First Human Approval for Agent-Initiated Orders
    objective: >
      Require a recorded first human approval before any agent-initiated
      order can be executed.
    group: oversight
    state: Active
    assessment-requirements:
      - id: apa-ctl-005-propose-human-approval.ar01
        text: >
          An agent-initiated path toward execution MUST request human
          approval for the action to perform. The approving application
          MUST record a first authorised human decision before performing
          that action. The assistant MUST NOT submit the order itself.
          Missing approval, AI self-approval, or an unauthenticated
          identity is a control failure. In the AIPA example this is
          assessed on demo.SubmitOrder: Passed only when the raise is
          from a trusted approving application or signed with that
          application's JWKS; otherwise Needs Review and GetApproval.
        applicability:
          - propose
          - execute
          - human-approval-required
        recommendation: >
          Correlate order-construction and approval events with approval
          records; treat assistant-originated submits, missing approver
          identity, or self-approval as failures. In the example, inspect
          raise identity and attestation on demo.SubmitOrder.
        state: Active
    guidelines:
      - reference-id: apa-guidance
        entries:
          - reference-id: apa-guidance-propose-approval
          - reference-id: apa-guidance-order-limits
          - reference-id: apa-guidance-human-oversight
          - reference-id: apa-guidance-tool-allowlist
      - reference-id: FINOS-AIR
        entries:
          - reference-id: AIR-PREV-018
          - reference-id: AIR-PREV-019
          - reference-id: AIR-DET-011
          - reference-id: AIR-DET-021
    threats:
      - reference-id: apa-threats
        entries:
          - reference-id: unauthorized-order-proposal
          - reference-id: unauthorized-trade-execution
          - reference-id: loss-of-human-oversight
