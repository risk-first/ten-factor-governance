title: AI Portfolio Assistant Control Catalog

metadata:
  id: apa-controls
  type: ControlCatalog
  version: "0.3.0"
  gemara-version: "1.2.0"
  draft: true
  date: "2026-09-11T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: >
    Threat-informed controls for governing the Financial AI Portfolio
    Assistant across the observe-to-execute authority ladder. Composes
    FINOS AIGF mitigations, CCC Multi-Agent Reference Architecture controls,
    and CCC Managed Kubernetes host controls via Gemara imports rather than
    twinning those catalogs.
  mapping-references:
    - id: apa-threats
      title: AI Portfolio Assistant Threat Catalog
      version: "0.1.0"
      url: file://threat.yaml
      description: >
        Layer 2 threats mitigated by these controls.
    - id: apa-guidance
      title: AI Portfolio Assistant Guidelines
      version: "0.2.0"
      url: file://../../guidance.yaml
      description: >
        Layer 1 guidance implemented by these controls.
    - id: FINOS-AIR
      title: FINOS AI Governance Framework
      version: "0.2.0"
      url: file://../../../../aigf/guidance.yaml
      description: >
        FINOS AIGF mitigations composed into the assistant governance model.
    - id: CCC.K8S.CN
      title: CCC Managed Kubernetes Controls
      version: "v2026.07-rc"
      url: file://../../../../ccc-k8s/controls.yaml
      description: >
        Host-layer Managed Kubernetes controls assumed for the assistant
        workload; not re-authored here.
    - id: CCC.MARefArc.CP
      title: CCC Multi-Agent Reference Architecture Capabilities
      version: "1.0.0-dev"
      url: file://../../../../ccc-ma-refarch/capabilities.yaml
    - id: CCC.MARefArc.CN
      title: CCC Multi-Agent Reference Architecture Controls
      version: "1.0.0-dev"
      url: file://../../../../ccc-ma-refarch/controls.yaml
      description: >
        Architecture-layer CCC multi-agent controls composed alongside AIGF
        mitigations for the assistant twin.
  applicability-groups:
    - id: all-authority-levels
      title: All Authority Levels
      description: >
        Applies to every AI Portfolio Assistant session regardless of
        permitted authority level.
    - id: observe
      title: Observe Authority
      description: >
        Applies when the assistant may read portfolio and related context.
    - id: analyse
      title: Analyse Authority
      description: >
        Applies when the assistant may invoke deterministic apps and consume
        calculated results.
    - id: explain
      title: Explain Authority
      description: >
        Applies when the assistant may generate explanations of positions and
        risks.
    - id: recommend
      title: Recommend Authority
      description: >
        Applies when the assistant may generate investment recommendations.
    - id: propose
      title: Propose Authority
      description: >
        Applies when the assistant may construct proposed orders for human
        review.
    - id: execute
      title: Execute Authority
      description: >
        Applies to trade-execution capability; autonomous AI use is
        prohibited.
    - id: human-approval-required
      title: Human Approval Required
      description: >
        Applies when consequential propose-level actions require recorded
        human approval before proceeding.

groups:
  - id: authority-bound
    title: Authority Boundaries
    description: >
      Controls that bind assistant behaviour to the observe-to-execute
      authority ladder.

  - id: oversight
    title: Human Oversight
    description: >
      Controls that retain meaningful human review and approval for
      consequential actions.

  - id: data-protection
    title: Data Protection
    description: >
      Controls that protect portfolio confidentiality and prevent
      cross-client contamination.

  - id: tool-governance
    title: Tool Governance
    description: >
      Controls that constrain tool calling, FDC3 invocation, and injected
      content misuse.

  - id: assurance
    title: Assurance and Evidence
    description: >
      Controls that ground explanations, retain session evidence, and
      escalate incidents.

  - id: model-supply
    title: Model Supply Chain
    description: >
      Controls governing third-party model provider handling of firm and
      client data.

