# ApplicabilityProfile — ISO/IEC 42001 Clause 6.1.3
# Illustrative AIMS document for the AI Portfolio Assistant example.
# iso-type: ApplicabilityProfile

title: "Statement of Applicability — AI Portfolio Assistant controls"

metadata:
  id: apa-applicability-profile
  type: ApplicabilityProfile
  version: "0.2.0"
  gemara-version: "1.5.0"
  standard: "ISO/IEC 42001:2023"
  draft: true
  date: "2026-09-11T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: |
    Applicability decisions for each control in apa-controls, including
    implementation state and the risks treated, plus inherited CCC Managed
    Kubernetes host assumptions for the assistant workload.
  mapping-references:
    - id: apa-controls
      title: "AI Portfolio Assistant control catalog"
      version: "0.2.0"
      url: file://../control.yaml
    - id: apa-risks
      title: "AI Portfolio Assistant risk catalog"
      version: "0.1.0"
      url: file://../risk.yaml
    - id: apa-risk-assessment
      title: "AI Portfolio Assistant risk assessment"
      version: "0.1.0"
      url: file://risk-assessment.yaml
    - id: apa-policy
      title: "AI Portfolio Assistant policy"
      version: "0.2.0"
      url: file://../policy.yaml
    - id: apa-stakeholder-requirements
      title: "Stakeholder requirements for the AI Portfolio Assistant"
      version: "0.1.0"
      url: file://stakeholder-requirements.yaml
    - id: CCC.K8S.CN
      title: "CCC Managed Kubernetes Controls"
      version: "v2026.07-rc"
      url: file://../../ccc-k8s/k8s/controls.yaml
    - id: FINOS-AIR
      title: "FINOS AI Governance Framework"
      version: "0.2.0"
      url: file://../../aigf/guidance.yaml

clauses: ["6.1.3"]

reference-set: "apa-controls (AI Portfolio Assistant ControlCatalog)"

risk-assessment:
  reference-id: apa-risk-assessment

decisions:
  - id: soa-apa-ctl-001
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-001-authority-ceiling
    applicable: true
    justification: "Defines the enforceable authority ladder for all sessions."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    owner:
      name: "AI Governance Office"
    policies:
      - reference-id: apa-policy

  - id: soa-apa-ctl-002
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-002-observe-analyse-allow
    applicable: true
    justification: "Permits low-consequence observe/analyse within the ceiling."
    state: Implemented
    owner:
      name: "AI Portfolio Assistant Engineering"

  - id: soa-apa-ctl-003
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-003-explain-disclosure
    applicable: true
    justification: "Supports meaningful human oversight of explanations."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: operational-overreliance
    owner:
      name: "AI Portfolio Assistant Engineering"

  - id: soa-apa-ctl-004
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-004-recommend-gating
    applicable: true
    justification: "Gates recommendations that can influence investment decisions."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unsuitable-investment-influence
      - reference-id: apa-risks
        entry-id: market-conduct-breach
    requirements:
      - reference-id: apa-stakeholder-requirements
        entry-id: req-suitability
    owner:
      name: "Compliance"

  - id: soa-apa-ctl-005
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-005-propose-human-approval
    applicable: true
    justification: "Load-bearing HITL gate for order proposals."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    requirements:
      - reference-id: apa-stakeholder-requirements
        entry-id: req-no-autonomous-trading
    owner:
      name: "AI Governance Office"
    residual-risk:
      severity: Medium
      accepted-by:
        name: "Chief Information Officer"
      date: "2026-09-08T00:00:00Z"
      justification: "Near-miss residual accepted pending quarterly sampling."

  - id: soa-apa-ctl-006
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-006-execute-prohibit
    applicable: true
    justification: "Absolute prohibition on autonomous execution."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    owner:
      name: "AI Governance Office"

  - id: soa-apa-ctl-007
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-007-portfolio-access-control
    applicable: true
    justification: "Entitlement-bound portfolio access is mandatory for client confidentiality."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: client-confidentiality-breach
    owner:
      name: "Chief Data Officer"

  - id: soa-apa-ctl-008
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-008-cross-portfolio-isolation
    applicable: true
    justification: "Prevents cross-book leakage in multi-portfolio sessions."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: client-confidentiality-breach
    owner:
      name: "Chief Data Officer"

  - id: soa-apa-ctl-009
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-009-deterministic-calc-only
    applicable: true
    justification: "Keeps numerical risk/exposure outputs in deterministic tools."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unsuitable-investment-influence
    owner:
      name: "Model Risk Management"

  - id: soa-apa-ctl-010
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-010-tool-allowlist
    applicable: true
    justification: "Restricts FDC3 intents and tools to approved specialist applications."
    state: Implemented
    owner:
      name: "AI Portfolio Assistant Engineering"

  - id: soa-apa-ctl-011
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-011-prompt-injection-defenses
    applicable: true
    justification: "Research content is untrusted input that can attempt authority escalation."
    state: "Partially Implemented"
    risks:
      - reference-id: apa-risks
        entry-id: model-supply-chain-exposure
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    owner:
      name: "AI Portfolio Assistant Engineering"
    due: "2026-12-15T00:00:00Z"
    implementation: |
      Input filtering and tool-call confirmation present; adversarial research
      red-teaming coverage still expanding.

  - id: soa-apa-ctl-012
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-012-explanation-grounding
    applicable: true
    justification: "Grounds explanations and recommendations in retrieved sources/tool outputs."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: unsuitable-investment-influence
      - reference-id: apa-risks
        entry-id: operational-overreliance
    owner:
      name: "AI Portfolio Assistant Engineering"

  - id: soa-apa-ctl-013
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-013-session-logging
    applicable: true
    justification: "Provides evidence for audit, incidents and human-approval coverage metrics."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: regulatory-non-compliance
    owner:
      name: "AI Governance Office"

  - id: soa-apa-ctl-014
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-014-model-provider-controls
    applicable: true
    justification: "Manages hosted-model dependency and contractual processing limits."
    state: "Partially Implemented"
    risks:
      - reference-id: apa-risks
        entry-id: model-supply-chain-exposure
    owner:
      name: "Model Risk Management"
    due: "2026-11-30T00:00:00Z"
    implementation: |
      Version pinning and DPA in place; continuous evaluation hooks against
      provider model updates still being automated.

  - id: soa-apa-ctl-015
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-015-incident-escalation
    applicable: true
    justification: "Required for serious AI incident handling and FCA notification readiness."
    state: Implemented
    risks:
      - reference-id: apa-risks
        entry-id: regulatory-non-compliance
    requirements:
      - reference-id: apa-stakeholder-requirements
        entry-id: req-regulatory-oversight
    owner:
      name: "AI Governance Office"

  - id: soa-apa-ctl-016
    control:
      reference-id: apa-controls
      entry-id: apa-ctl-016-fdc3-security-provenance
    applicable: true
    justification: >
      Demo suite contexts used as evidence must carry FDC3 Security signatures
      so explain/recommend/propose grounding is provenance-verified.
    state: "Partially Implemented"
    risks:
      - reference-id: apa-risks
        entry-id: unsuitable-investment-influence
      - reference-id: apa-risks
        entry-id: operational-overreliance
    owner:
      name: "AI Portfolio Assistant Engineering"
    due: "2026-11-30T00:00:00Z"
    implementation: |
      Signature verification hooked for demo.portfolioRisk and
      demo.researchBundle; remaining demo contexts and reject-on-unsigned
      path still rolling out.

  - id: soa-host-ccc-k8s-cn02
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN02
    applicable: true
    justification: >
      Host assumption: assistant workload on Managed Kubernetes inherits
      least-privilege cluster authorization from the CCC K8s twin.
    state: Assumed
    owner:
      name: "Platform Engineering"

  - id: soa-host-ccc-k8s-cn03
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN03
    applicable: true
    justification: "Host assumption: federated workload identity for the assistant service."
    state: Assumed
    owner:
      name: "Platform Engineering"

  - id: soa-host-ccc-k8s-cn05
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN05
    applicable: true
    justification: "Host assumption: restricted workload security for the assistant pods."
    state: Assumed
    owner:
      name: "Platform Engineering"

  - id: soa-host-ccc-k8s-cn06
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN06
    applicable: true
    justification: >
      Host assumption: default-deny network policies constrain assistant egress
      to approved model and desktop-integration endpoints.
    state: Assumed
    owner:
      name: "Platform Engineering"

  - id: soa-host-ccc-k8s-cn07
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN07
    applicable: true
    justification: "Host assumption: Kubernetes secrets for the assistant are protected per CCC."
    state: Assumed
    owner:
      name: "Platform Engineering"

  - id: soa-host-ccc-k8s-cn14
    control:
      reference-id: CCC.K8S.CN
      entry-id: CCC.K8S.CN14
    applicable: true
    justification: >
      Host assumption: cluster audit/monitoring retention complements app-layer
      session evidence (apa-ctl-013).
    state: Assumed
    owner:
      name: "Platform Engineering"

review:
  cadence: Annual
  last-reviewed: "2026-09-11T00:00:00Z"
  next-review: "2027-09-08T00:00:00Z"
  triggers:
    - "New control added to apa-controls"
    - "Risk assessment refresh"
    - "Change to Managed Kubernetes host control assumptions"
