clauses: ["4.3"]

statement: |
  This AIMS covers the development, deployment, operation and continual
  improvement of the AIPA used by portfolio managers in the
  Investment Management division of the firm. It includes AIPA's
  FDC3-mediated access to specialist applications, retrieval of investment
  research, authority-bounded recommendation and order-proposal behaviour, and
  the controls that detect, deny and evidence any attempt at unsupervised
  trade execution. Firm-wide foundation-model training and retail banking AI
  products are out of scope.

inclusions:
  - id: apa-system
    name: "AIPA"
    type: System
    description: |
      The production AIPA operating on the investment desktop across
      observe, analyse, explain, recommend and propose authority levels.
    owner:
      name: "AIPA Product Owner"
      affiliation: "Investment Management"
    target:
      reference-id: apa-ai-system-register
      entry-id: ai-portfolio-assistant

  - id: portfolio-assist-activity
    name: "Portfolio assistance activity"
    type: Activity
    description: |
      Human-supervised sessions in which a portfolio manager uses AIPA
      to observe portfolio context, run deterministic analytics, explain results,
      recommend actions and construct order proposals for approval.

  - id: autonomous-execution-control
    name: "Prevention of autonomous trade execution"
    type: Activity
    description: |
      Detecting, denying and evidencing attempts by AIPA or its tool
      path to submit or effect orders without human authorisation. Unsupervised
      execution is a prohibited intended use; governing that prohibition is in
      scope of this AIMS, not an exclusion from it.

exclusions:
  - id: model-training
    name: "Foundation model training and fine-tuning"
    type: Process
    justification: |
      The firm consumes a hosted foundation model; training and fine-tuning of
      that model are performed by the supplier and are assured through supplier
      governance rather than this AIMS's development lifecycle.
    governed-elsewhere: "Model supplier AIMS / contractual assurance"

  - id: retail-banking-ai
    name: "Retail banking AI products"
    type: System
    justification: |
      Retail customer-facing AI is owned by a different business unit with a
      separate management system and different regulatory obligations.
    governed-elsewhere: "Retail Banking AI management system"

interfaces:
  # Relations from docs/artifacts/finos/ai-portfolio-assistant/deployment.mdx
  - id: pm-uses-aipa
    description: |
      Portfolio Manager uses the AIPA on the FDC3 desktop to
      analyse portfolios and manage risk (deployment: BiRel Uses).
    direction: Bidirectional
    counterparty:
      reference-id: apa-party-register
      entry-id: portfolio-managers

  - id: fdc3-interface
    description: |
      AIPA raises FDC3 intents and receives / broadcasts desktop context
      via the FDC3 Desktop Agent (deployment: BiRel Raises intents / receives
      and broadcasts context).
    direction: Bidirectional
    counterparty:
      reference-id: apa-party-register
      entry-id: fdc3-desktop-agent

  - id: fdc3-governance-runtime
    description: |
      FDC3 Desktop Agent makes requests to the AIPA Governance
      Runtime before forwarding sensitive requests (deployment: Rel Makes
      requests to).
    direction: Bidirectional
    counterparty:
      reference-id: apa-party-register
      entry-id: governance-runtime

  - id: runtime-governance-model
    description: |
      Governance Runtime is informed by versioned Governance Model releases
      from the Artifact Repository (deployment: Rel Is Informed By).
    direction: Inbound
    counterparty:
      reference-id: apa-party-register
      entry-id: artifact-repository

  - id: runtime-evidence-record
    description: |
      Governance Runtime records, reports and aggregates evaluation and
      enforcement evidence to the Decisions and Evidence Record (deployment:
      Rel Records / reports / aggregates).
    direction: Outbound
    counterparty:
      reference-id: apa-party-register
      entry-id: evidence-record

  - id: aipa-agentic-model
    description: |
      AIPA sends prompts to and receives completions from the hosted
      Agentic Model / foundation-model API (deployment: Rel Prompts /
      completions). Version pinning, content filters and incident notification
      cross the organisational boundary.
    direction: Bidirectional
    counterparty:
      reference-id: apa-party-register
      entry-id: foundation-model-provider
    responsibilities:
      reference-id: apa-governance-contract
      entry-id: model-provider-governance

context:
  reference-id: apa-organisation-context

requirements:
  - reference-id: apa-stakeholder-requirements
    entry-id: req-no-autonomous-trading
  - reference-id: apa-stakeholder-requirements
    entry-id: req-human-oversight
  - reference-id: apa-stakeholder-requirements
    entry-id: req-client-confidentiality

review:
  cadence: Annual
  last-reviewed: "2026-09-30T00:00:00Z"
  next-review: "2027-09-30T00:00:00Z"
  triggers:
    - "Request to bring execute authority into production"
    - "Extension of AIPA to another business unit"
    - "Change to the deployment topology or firewall-crossing interfaces"
