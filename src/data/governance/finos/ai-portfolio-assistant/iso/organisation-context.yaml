clauses: ["4.1"]

purpose: |
  The financial institution provides portfolio managers in Investment Management
  with the AIPA (AI Portfolio Assistant), which observes FDC3 desktop context,
  invokes deterministic specialist applications for portfolio, risk and stress
  analysis, retrieves investment research, and helps managers understand
  positions and risks. AIPA may recommend or propose actions only within
  declared authority levels. Unsupervised trade execution is a prohibited
  intended use; preventing and evidencing that prohibition is part of how the
  organisation achieves the intended outcomes of this AIMS.

issues:
  - id: ai-influenced-suitability
    title: "AI-influenced recommendations can engage suitability and best-interest duties"
    origin: External
    category: Regulatory
    description: |
      The issue is not "MiFID exists"; it is that AIPA outputs can steer
      portfolio decisions in ways that engage suitability, client best interest
      and related conduct duties under UK/EU investment-services rules (MiFID II
      / UK MiFIR, COBS). The AIMS must keep human accountability and stop AI
      outputs being treated as unsupervised investment advice or execution.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: regulator-fca
      - reference-id: apa-party-register
        entry-id: compliance
    risks:
      - reference-id: apa-risks
        entry-id: unsuitable-investment-influence
      - reference-id: apa-risks
        entry-id: regulatory-non-compliance
    identified: "2026-06-01T00:00:00Z"

  - id: market-abuse-and-information-barriers
    title: "Portfolio context and research in AIPA path can create market-abuse exposure"
    origin: External
    category: Regulatory
    description: |
      Sessions expose holdings, research and proposed actions. Misuse, leakage
      across desks or poorly controlled dissemination of AI-drafted commentary
      can engage Market Abuse Regulation (UK MAR / EU MAR) and the firm's
      information-barrier arrangements. The AIMS must treat session isolation,
      logging and outbound communication controls as part of achieving intended
      outcomes—not as optional product polish.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: compliance
      - reference-id: apa-party-register
        entry-id: portfolio-managers
    risks:
      - reference-id: apa-risks
        entry-id: market-conduct-breach
      - reference-id: apa-risks
        entry-id: client-confidentiality-breach
    identified: "2026-09-30T00:00:00Z"

  - id: client-comms-and-recordkeeping
    title: "AI-assisted client or desk communications create recordkeeping and fair-comms duties"
    origin: External
    category: Regulatory
    description: |
      If AIPA drafts or shapes explanations, recommendations or
      proposal text that later reach clients or are retained as part of the
      investment process, firm obligations under COBS (fair, clear and not
      misleading communications), MiFID recordkeeping and related UK/EU
      conduct rules apply to those outputs. The AIMS must define which
      AIPA outputs are internal working material versus regulated
      communications, and retain evidence accordingly.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: compliance
      - reference-id: apa-party-register
        entry-id: clients
    risks:
      - reference-id: apa-risks
        entry-id: regulatory-non-compliance
    identified: "2026-09-30T00:00:00Z"

  - id: privacy-and-third-country-processing
    title: "Portfolio and client data in model prompts must not leave the banking firewall"
    origin: External
    category: Legal
    description: |
      Prompting a foundation model with portfolio context, client identifiers or
      research can constitute processing of personal data and confidential client
      information under UK GDPR / EU GDPR and client agreements. The AIMS
      therefore requires inference inside the banking firewall so prompts do not
      egress to the model supplier; residual supplier risk is limited to model
      artefacts and support channels, not session content.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: clients
      - reference-id: apa-party-register
        entry-id: foundation-model-provider
    risks:
      - reference-id: apa-risks
        entry-id: client-confidentiality-breach
      - reference-id: apa-risks
        entry-id: model-supply-chain-exposure
    identified: "2026-09-30T00:00:00Z"

  - id: smcr-accountability
    title: "Senior-manager accountability for AI that influences investment decisions"
    origin: External
    category: Regulatory
    description: |
      Under the Senior Managers and Certification Regime, accountable
      executives must be able to demonstrate reasonable steps over systems that
      influence investment outcomes. Ambiguous ownership of AIPA's
      authority ceiling, incidents or model changes is itself an issue for the
      AIMS achieving its intended outcomes.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: cio-top-management
      - reference-id: apa-party-register
        entry-id: regulator-fca
    risks:
      - reference-id: apa-risks
        entry-id: regulatory-non-compliance
    identified: "2026-09-30T00:00:00Z"

  - id: model-interpretation-risk
    title: "Managers may treat model interpretation of analytics as authoritative calculation"
    origin: Internal
    category: Organisational
    description: |
      AIPA interprets deterministic tool outputs and research rather
      than computing exposures itself. The organisational issue is over-reliance
      and weak challenge: hallucinated figures, weak grounding or drift can
      still mislead managers and create model-risk inventory and challenge
      obligations even though the numerical engines sit elsewhere.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: model-risk
      - reference-id: apa-party-register
        entry-id: foundation-model-provider
    risks:
      - reference-id: apa-risks
        entry-id: operational-overreliance
      - reference-id: apa-risks
        entry-id: model-supply-chain-exposure
    identified: "2026-06-01T00:00:00Z"

  - id: desktop-control-plane
    title: "FDC3 desktop interoperability is both the value path and a sensitive-intent control plane"
    origin: Internal
    category: Technological
    description: |
      AIPA's usefulness depends on FDC3 context sharing and approved
      intents into portfolio, risk, stress and research applications. That same
      path is how sensitive activities are raised and gated. Tool allowlisting,
      session isolation and desktop security therefore bound AIMS outcomes as
      much as model controls do—this is a technological dependency, not a
      separate "IT topic" outside Clause 4.1.
    effect: Both
    parties:
      - reference-id: apa-party-register
        entry-id: portfolio-managers
      - reference-id: apa-party-register
        entry-id: fdc3-desktop-agent
    identified: "2026-06-15T00:00:00Z"

  - id: authority-ceiling-erosion
    title: "Commercial pressure to raise autonomy can erode the declared authority ceiling"
    origin: External
    category: Competitive
    description: |
      Peer offerings and internal productivity targets push toward faster
      proposal-to-trade loops. The issue for the AIMS is erosion of the
      prohibition on unsupervised execution unless top management explicitly
      retains and resources that ceiling. Competitive pressure is relevant only
      insofar as it threatens the intended authority boundary.
    effect: Threat
    parties:
      - reference-id: apa-party-register
        entry-id: cio-top-management
    risks:
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    identified: "2026-07-01T00:00:00Z"

jurisdictions:
  - "United Kingdom"
  - "European Union"

boundaries:
  - id: investment-management
    name: "Investment Management division"
    type: "Business Unit"
    description: |
      Institutional and discretionary portfolio management desks that use the
      AIPA on the firm desktop. Retail banking AI products and
      firm-wide model training platforms are outside this boundary.
    owner:
      name: "Chief Investment Officer"
      affiliation: "Investment Management"

review:
  cadence: Annual
  last-reviewed: "2026-09-30T00:00:00Z"
  next-review: "2027-09-30T00:00:00Z"
  triggers:
    - "Material change to MiFID/COBS/MAR interpretation affecting AI recommendations or communications"
    - "Introduction of a new FDC3 specialist application into the tool allowlist"
    - "Proposal to raise the authority ceiling above propose"
    - "Change to model-supplier data residency or subprocessors"
