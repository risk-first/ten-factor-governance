clauses: ["A.8.4"]

entries:
  - id: inc-propose-without-approval
    title: "Near miss — assistant constructed order proposal without approval gate"
    description: |
      During a propose-level session the assistant constructed a structured order
      proposal that was presented as ready for trading-desk handoff without the
      human approval gate enforcing acknowledgement. The portfolio manager did
      not approve; no order was submitted. Detected via session-logger alert when
      proposal_ready was emitted without approval_recorded.
    category: "Authority control near miss"
    severity: High
    status: Contained
    detected: "2026-08-28T14:22:00Z"
    occurred: "2026-08-28T14:18:00Z"
    resolved: "2026-08-28T14:40:00Z"
    owner:
      name: "AI Governance Office"
    affected-systems:
      - reference-id: apa-ai-system-register
        entry-id: ai-portfolio-assistant
    affected-parties:
      - reference-id: apa-party-register
        entry-id: portfolio-managers
      - reference-id: apa-party-register
        entry-id: clients
        remarks: "Potential exposure only; no client trade effected"
    risks:
      - reference-id: apa-risks
        entry-id: unauthorized-trading
    controls:
      - reference-id: apa-controls
        entry-id: apa-ctl-005-propose-human-approval
        remarks: "Failed / bypassed"
      - reference-id: apa-controls
        entry-id: apa-ctl-006-execute-prohibit
        remarks: "Held — no submission occurred"
      - reference-id: apa-controls
        entry-id: apa-ctl-013-session-logging
        remarks: "Held — enabled detection"
    communications:
      - id: icomm-compliance
        audience:
          reference-id: apa-party-register
          entry-id: compliance
        requirement:
          reference-id: apa-communication-plan
          entry-id: comm-incident-to-compliance
        due: "2026-08-28T18:22:00Z"
        sent: "2026-08-28T15:05:00Z"
        channel: "Incident management platform"
        summary: |
          Near miss: propose without approval gate; no execution; desk propose
          authority suspended pending fix.
        status: Acknowledged
      - id: icomm-pms
        audience:
          reference-id: apa-party-register
          entry-id: portfolio-managers
        requirement:
          reference-id: apa-communication-plan
          entry-id: comm-pm-incident-awareness
        sent: "2026-08-28T15:20:00Z"
        channel: "Desk broadcast"
        summary: "Propose authority temporarily disabled on affected desk."
        status: Sent
      - id: icomm-fca
        audience:
          reference-id: apa-party-register
          entry-id: regulator-fca
        requirement:
          reference-id: apa-reporting-obligation
          entry-id: fca-serious-ai-incident
        status: "Not Required"
        summary: |
          Assessed as near miss with no client trade or market impact; recorded
          for internal escalation and management review. Escalation to FCA not
          triggered under current criteria.
    nonconformities:
      - reference-id: apa-corrective-action
        entry-id: nc-propose-without-approval
