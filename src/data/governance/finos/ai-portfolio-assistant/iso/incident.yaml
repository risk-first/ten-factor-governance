  type: IncidentLog
  version: "0.1.0"
  gemara-version: "1.5.0"
  standard: "ISO/IEC 42001:2023"
  draft: true
  date: "2026-09-10T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: |
    Operational AI incidents for the Portfolio Assistant, including the
    propose-without-approval near miss.
  mapping-references:
    - id: apa-ai-system-register
      title: "AI systems in the scope of the AIMS"
      version: "0.1.0"
      url: file://ai-system-register.yaml
    - id: apa-party-register
      title: "Parties to the AI Portfolio Assistant"
      version: "0.1.0"
      url: file://party-register.yaml
    - id: apa-risks
      title: "AI Portfolio Assistant risk catalog"
      version: "0.1.0"
      url: file://../gemara/components/ai-portfolio-assistant/risk.yaml
    - id: apa-controls
