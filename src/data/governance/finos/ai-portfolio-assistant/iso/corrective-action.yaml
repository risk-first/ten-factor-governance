metadata:
  id: apa-corrective-action
  type: CorrectiveActionLog
  version: "0.1.0"
  gemara-version: "1.5.0"
  standard: "ISO/IEC 42001:2023"
  draft: true
  date: "2026-09-10T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: |
    Nonconformities and corrective actions for the AIMS, including the
    propose-without-approval near miss.
  mapping-references:
    - id: apa-controls
      title: "AI Portfolio Assistant control catalog"
      version: "0.1.0"
      url: file://../control.yaml
    - id: apa-incident
      title: "AI incident log"
