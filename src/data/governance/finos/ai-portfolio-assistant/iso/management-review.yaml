# ManagementReviewProgramme — ISO/IEC 42001 Clause 9.3
# Illustrative AIMS document for the AIPA example.
# iso-type: ManagementReviewProgramme

title: "Management review programme for the AIPA AIMS"

metadata:
  id: apa-management-review-programme
  type: ManagementReviewProgramme
  version: "0.2.0"
  gemara-version: "1.5.0"
  standard: "ISO/IEC 42001:2023"
  draft: true
  date: "2026-09-30T00:00:00Z"
  author:
    id: ai-governance-office
    name: AI Governance Office
    type: Human
  description: |
    Recurring top-management review of the AIPA AIMS: frequency, chair and
    attendees, required inputs and required outputs. Defined by process, not by
    the minutes of a single sitting.
  mapping-references:
    - id: apa-party-register
      title: "Parties to the AIPA"
      version: "0.1.0"
      url: file://party-register.yaml
    - id: apa-organisation-context
      title: "Organisational context"
      version: "0.1.0"
      url: file://organisation-context.yaml
    - id: apa-management-objectives
      title: "AI management objectives"
      version: "0.1.0"
      url: file://management-objectives.yaml
    - id: apa-audit-programme
      title: "Internal audit programme"
      version: "0.1.0"
      url: file://audit-programme.yaml
    - id: apa-corrective-action
      title: "Corrective action log"
      version: "0.1.0"
      url: file://corrective-action.yaml
    - id: apa-incident
      title: "AI incident log"
      version: "0.1.0"
      url: file://incident.yaml
    - id: apa-risk-assessment
      title: "AI risk assessment"
      version: "0.1.0"
      url: file://risk-assessment.yaml
    - id: apa-impact-assessment
      title: "AI impact assessment"
      version: "0.1.0"
      url: file://impact-assessment.yaml
    - id: apa-applicability-profile
      title: "Statement of Applicability"
      version: "0.1.0"
      url: file://applicability-profile.yaml

clauses: ["9.3"]

frequency: Quarterly

objectives:
  - "Confirm continuing suitability of the AIMS to the firm's purpose and prohibited uses"
  - "Confirm adequacy of documented information, resources and control implementation"
  - "Confirm effectiveness of the AIMS, including authority-boundary controls"
  - "Decide changes, acceptances and improvement actions for the next cycle"

chair:
  reference-id: apa-party-register
  entry-id: cio-top-management

attendees:
  - reference-id: apa-party-register
    entry-id: cio-top-management
  - reference-id: apa-party-register
    entry-id: ai-governance-office
  - reference-id: apa-party-register
    entry-id: compliance
  - reference-id: apa-party-register
    entry-id: model-risk

required-inputs:
  - id: prior-actions
    description: "Status of actions committed at previous management reviews"
  - id: context-changes
    description: "External and internal changes bearing on the AIMS since the last review"
    sources:
      - reference-id: apa-organisation-context
  - id: party-feedback
    description: "Feedback from interested parties relevant to the AIMS"
  - id: objectives
    description: "Performance against management objectives"
    sources:
      - reference-id: apa-management-objectives
  - id: audit-results
    description: "Internal audit outcomes under the audit programme"
    sources:
      - reference-id: apa-audit-programme
  - id: nonconformities
    description: "Nonconformities and corrective actions"
    sources:
      - reference-id: apa-corrective-action
  - id: incidents
    description: "AI incidents in the review cycle"
    sources:
      - reference-id: apa-incident
  - id: risk-status
    description: "State of the AI risk assessment and treatment"
    sources:
      - reference-id: apa-risk-assessment
  - id: impact-status
    description: "State of AI impact assessments"
    sources:
      - reference-id: apa-impact-assessment
  - id: improvement-opportunities
    description: "Identified opportunities to improve the AIMS"
  - id: resource-adequacy
    description: "Whether the AIMS is adequately resourced for its scope"

required-outputs:
  - id: suitability-finding
    description: "Judgement on suitability of the AIMS to organisational purpose"
  - id: adequacy-finding
    description: "Judgement on adequacy of documented information and controls"
  - id: effectiveness-finding
    description: "Judgement on effectiveness of the AIMS in operation"
  - id: decisions
    description: "Recorded decisions on scope, policy, objectives, resources, risk acceptance or improvement"
  - id: actions
    description: "Committed follow-up actions with owners and due dates, tracked to closure"

owner:
  reference-id: apa-party-register
  entry-id: cio-top-management
