type: Framework

front-matter: |
  These guidelines govern an AI Portfolio Assistant that operates across a
  suite of FDC3 applications used by portfolio managers. Deterministic
  applications perform portfolio, risk, and market calculations. The
  assistant interprets those results, retrieves relevant investment research,
  and helps the portfolio manager understand positions and risks.

  As capability increases, so does consequence. Governance therefore
  controls how much authority is delegated to the AI and under what
  conditions, following the authority ladder:

    observe → analyse → explain → recommend → propose → execute

  An organisation may allow the assistant to analyse and explain
  autonomously, permit recommendations only when specified controls are
  satisfied, require human approval for proposed orders, and prohibit
  autonomous trade execution entirely. These guidelines make those
  boundaries explicit, enforceable, and auditable.

groups:
  - id: authority-ladder
    title: Authority Ladder
    description: >
      Controls that define, grant, and enforce authority levels from
      observe through execute.

  - id: oversight
    title: Oversight
    description: >
      Human-in-the-loop and accountability requirements for consequential
      AI outputs.

  - id: data-protection
    title: Data Protection
    description: >
      Confidentiality, FDC3 context boundaries, and model-provider data
      handling.

  - id: tool-use
    title: Tool Use
    description: >
      Requirements for deterministic applications, research retrieval, demo
      FDC3 intents, provenance, and safe tool invocation.

  - id: assurance
    title: Assurance
    description: >
      Logging, evidence retention, and incident escalation for continuous
      improvement of AI governance.

guidelines:
  - id: apa-guidance-authority-ladder
    title: Authority Ladder Definition
    group: authority-ladder
    state: Active
    objective: >
      Establish and enforce a single authority ladder for the AI Portfolio
      Assistant with explicit grant of the maximum permitted level per
      session, user, and intended use.
    statements:
      - id: apa-guidance-authority-ladder.1
        title: Ladder levels
        text: >
          The authority ladder comprises observe, analyse, explain,
          recommend, propose, and execute, in ascending order of
          consequence.
      - id: apa-guidance-authority-ladder.2
        title: Explicit grant
        text: >
          The assistant must receive an explicit authority grant before
          operating. Default grant is observe unless a higher level is
          authorized and controls for that level are satisfied.
      - id: apa-guidance-authority-ladder.3
        title: No implied escalation
        text: >
          Capability to perform a higher-level action must not be treated
          as authorization to perform it.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: proportional-authority
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: authority-escalation
    see-also:
      - apa-guidance-observe-only
      - apa-guidance-recommend-controls
      - apa-guidance-propose-approval
      - apa-guidance-execute-prohibited

  - id: apa-guidance-observe-only
    title: Observe Authority Controls
    group: authority-ladder
    state: Active
    objective: >
      Constrain observe-level sessions to reading authorized portfolio and
      application context without analysis, explanation, or action.
    applicability:
      - observe
    statements:
      - id: apa-guidance-observe-only.1
        text: >
          At observe, the assistant may read FDC3 context and approved
          portfolio views for the active user and portfolio only.
      - id: apa-guidance-observe-only.2
        text: >
          At observe, the assistant must not invoke analysis tools, produce
          explanations or recommendations, construct order proposals, or
          trigger execution.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: proportional-authority
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: authority-escalation
          - reference-id: cross-portfolio-context-bleed
          - reference-id: unintended-fdc3-broadcast

  - id: apa-guidance-analyse-explain
    title: Analyse and Explain Authority Controls
    group: authority-ladder
    state: Active
    objective: >
      Allow analysis and explanation only through deterministic tools and
      grounded interpretation within the granted authority level.
    applicability:
      - analyse
      - explain
    statements:
      - id: apa-guidance-analyse-explain.1
        title: Analyse
        text: >
          At analyse, the assistant may invoke approved deterministic
          applications to compute exposures, stress scenarios, and related
          analytics for the active portfolio.
      - id: apa-guidance-analyse-explain.2
        title: Explain
        text: >
          At explain, the assistant may interpret deterministic results and
          retrieved research to help the portfolio manager understand
          positions and risks, disclosing material uncertainty.
      - id: apa-guidance-analyse-explain.3
        text: >
          Analyse and explain must not include recommendations, order
          proposals, or execution.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: proportional-authority
          - reference-id: deterministic-calculations
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: hallucinated-financial-claim
          - reference-id: overconfident-explanation
          - reference-id: stale-or-incorrect-market-data
    see-also:
      - apa-guidance-deterministic-calcs
      - apa-guidance-research-hygiene

  - id: apa-guidance-recommend-controls
    title: Recommendation Authority Controls
    group: authority-ladder
    state: Active
    objective: >
      Permit recommendations only when suitability, grounding, and oversight
      controls for the recommend authority level are satisfied.
    applicability:
      - recommend
    statements:
      - id: apa-guidance-recommend-controls.1
        text: >
          Recommendations must cite supporting deterministic outputs or
          approved research and must not present speculative claims as fact.
      - id: apa-guidance-recommend-controls.2
        text: >
          Recommendations must be consistent with the client's mandate and
          risk profile and must be presented as suggestions for portfolio
          manager consideration, not as instructions.
      - id: apa-guidance-recommend-controls.3
        text: >
          A recommendation must not be forwarded automatically into order
          construction or execution workflows.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: proportional-authority
          - reference-id: suitability-and-conduct
          - reference-id: human-oversight-of-consequence
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: unsupervised-recommendation-acceptance
          - reference-id: overconfident-explanation
          - reference-id: hallucinated-financial-claim

  - id: apa-guidance-propose-approval
    title: Proposal Authority and Human Approval
    group: authority-ladder
    state: Active
    objective: >
      Require recorded human approval before any order proposal proceeds
      toward trading workflows.
    applicability:
      - propose
    statements:
      - id: apa-guidance-propose-approval.1
        text: >
          At propose, the assistant may construct a structured order
          proposal for the active portfolio based on deterministic analytics
          and approved inputs.
      - id: apa-guidance-propose-approval.2
        title: Mandatory approval
        text: >
          An order proposal must not leave the assistant's controlled
          workspace or enter trading systems until an authorized portfolio
          manager records explicit approval.
      - id: apa-guidance-propose-approval.3
        text: >
          Approval evidence must identify the approver, timestamp, proposal
          identifier, and material assumptions.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: human-oversight-of-consequence
          - reference-id: evidence-of-authority-use
          - reference-id: proportional-authority
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: order-proposal-without-approval
          - reference-id: authority-escalation
    see-also:
      - apa-guidance-human-oversight
      - apa-guidance-logging

  - id: apa-guidance-execute-prohibited
    title: Autonomous Execution Prohibited
    group: authority-ladder
    state: Active
    objective: >
      Prohibit the assistant from autonomously executing orders or
      effecting portfolio changes.
    applicability:
      - execute
    statements:
      - id: apa-guidance-execute-prohibited.1
        title: Hard prohibition
        text: >
          The AI Portfolio Assistant must not submit orders, trigger
          execution intents, or otherwise effect portfolio changes
          autonomously under any authority grant.
      - id: apa-guidance-execute-prohibited.2
        text: >
          Execution may occur only through approved human-operated trading
          workflows after a separately authorized human decision.
      - id: apa-guidance-execute-prohibited.3
        text: >
          Technical controls must block FDC3 intents, APIs, and tools that
          would enable autonomous execution by the assistant.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: prohibited-autonomous-execution
          - reference-id: proportional-authority
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: execution-bypass
          - reference-id: order-proposal-without-approval

  - id: apa-guidance-human-oversight
    title: Human Oversight Requirements
    group: oversight
    state: Active
    objective: >
      Ensure a qualified portfolio manager retains meaningful control over
      consequential AI outputs.
    statements:
      - id: apa-guidance-human-oversight.1
        text: >
          Portfolio managers remain accountable for investment decisions
          informed or proposed by the assistant.
      - id: apa-guidance-human-oversight.2
        text: >
          Human review is mandatory for propose-level outputs and for any
          path that could lead to execution.
      - id: apa-guidance-human-oversight.3
        text: >
          Oversight interfaces must present supporting evidence,
          assumptions, and residual uncertainty in a form that enables
          informed approval or rejection.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: human-oversight-of-consequence
          - reference-id: suitability-and-conduct
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: unsupervised-recommendation-acceptance
          - reference-id: order-proposal-without-approval
          - reference-id: overconfident-explanation

  - id: apa-guidance-deterministic-calcs
    title: Deterministic Calculation Separation
    group: tool-use
    state: Active
    objective: >
      Ensure numerical financial calculations are performed by deterministic
      applications rather than by the language model.
    statements:
      - id: apa-guidance-deterministic-calcs.1
        text: >
          Exposures, stress scenarios, valuations, and similar figures used
          as authoritative inputs must originate from approved deterministic
          applications.
      - id: apa-guidance-deterministic-calcs.2
        text: >
          The assistant may summarize and explain deterministic outputs but
          must not invent substitute numerical results or present model
          arithmetic as authoritative.
      - id: apa-guidance-deterministic-calcs.3
        text: >
          Explanations and recommendations must reference the originating
          tool outputs when citing quantitative claims.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: deterministic-calculations
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: hallucinated-financial-claim
          - reference-id: stale-or-incorrect-market-data
          - reference-id: tool-argument-injection

  - id: apa-guidance-research-hygiene
    title: Investment Research Input Hygiene
    group: tool-use
    state: Active
    objective: >
      Treat retrieved investment research as untrusted input and prevent
      prompt injection or undue influence on authority and advice.
    statements:
      - id: apa-guidance-research-hygiene.1
        text: >
          Research content must be retrieved through approved channels and
          isolated from system and policy instructions.
      - id: apa-guidance-research-hygiene.2
        text: >
          Instructions found in research must not escalate authority, alter
          tool arguments, or override governance controls.
      - id: apa-guidance-research-hygiene.3
        text: >
          When research conflicts with deterministic application outputs,
          the conflict must be disclosed and deterministic outputs take
          precedence for quantitative claims.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: suitability-and-conduct
          - reference-id: deterministic-calculations
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: prompt-injection-via-research
          - reference-id: tool-argument-injection
          - reference-id: overconfident-explanation

  - id: apa-guidance-fdc3-boundaries
    title: FDC3 Context and Broadcast Boundaries
    group: data-protection
    state: Active
    objective: >
      Confine FDC3 context sharing to authorized applications, users, and
      portfolios for the current session.
    statements:
      - id: apa-guidance-fdc3-boundaries.1
        text: >
          The assistant may consume and emit FDC3 context only for the
          active portfolio manager session and authorized application set.
      - id: apa-guidance-fdc3-boundaries.2
        text: >
          Portfolio context from one client must not be mixed into prompts,
          tool calls, or broadcasts for another client.
      - id: apa-guidance-fdc3-boundaries.3
        text: >
          Sensitive explanations, recommendations, and order proposals must
          not be broadcast on FDC3 channels beyond applications explicitly
          authorized to receive them.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: client-confidentiality
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: cross-portfolio-context-bleed
          - reference-id: unintended-fdc3-broadcast

  - id: apa-guidance-model-providers
    title: Model Provider Data Controls
    group: data-protection
    state: Active
    objective: >
      Prevent unauthorized exfiltration of client and portfolio data to
      external model providers.
    statements:
      - id: apa-guidance-model-providers.1
        text: >
          Only approved model providers and deployment configurations may
          process Portfolio Assistant prompts and tool results.
      - id: apa-guidance-model-providers.2
        text: >
          Prompts must minimize client-identifying and portfolio detail to
          what is necessary for the granted authority and intended use.
      - id: apa-guidance-model-providers.3
        text: >
          Provider contracts and technical controls must address retention,
          training use, residency, and breach notification consistent with
          firm policy.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: client-confidentiality
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: model-provider-data-exfiltration
          - reference-id: cross-portfolio-context-bleed

  - id: apa-guidance-logging
    title: Authority Use Logging and Evidence
    group: assurance
    state: Active
    objective: >
      Retain auditable evidence of authority grants, tool use, outputs, and
      human approvals.
    statements:
      - id: apa-guidance-logging.1
        text: >
          Log authority grants, level changes, tool invocations, material
          outputs by authority level, and human approval or rejection
          decisions.
      - id: apa-guidance-logging.2
        text: >
          Evidence must be attributable to user, session, portfolio, and
          guideline or control identifiers where applicable.
      - id: apa-guidance-logging.3
        text: >
          Retention and access to logs must support assurance review,
          incident investigation, and continuous improvement of the AI
          management system.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: evidence-of-authority-use
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: authority-escalation
          - reference-id: order-proposal-without-approval
          - reference-id: execution-bypass

  - id: apa-guidance-incident-escalation
    title: Incident Detection and Escalation
    group: assurance
    state: Active
    objective: >
      Detect, escalate, and remediate authority abuse, confidentiality
      incidents, and decision-quality failures involving the assistant.
    statements:
      - id: apa-guidance-incident-escalation.1
        text: >
          Attempted execution bypass, unapproved proposal forwarding, and
          suspected cross-portfolio disclosure must be treated as reportable
          incidents.
      - id: apa-guidance-incident-escalation.2
        text: >
          Material hallucinations, stale-data reliance, or injection
          events that affected recommendations or proposals must be
          escalated to the AI Governance Office and relevant risk owners.
      - id: apa-guidance-incident-escalation.3
        text: >
          Incident outcomes must feed updates to authority grants,
          controls, and this guidance where systemic weaknesses are found.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: evidence-of-authority-use
          - reference-id: prohibited-autonomous-execution
          - reference-id: client-confidentiality
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: execution-bypass
          - reference-id: order-proposal-without-approval
          - reference-id: cross-portfolio-context-bleed
          - reference-id: prompt-injection-via-research
          - reference-id: model-provider-data-exfiltration

  - id: apa-guidance-demo-intents
    title: Demo FDC3 Intent Allowlist
    group: tool-use
    state: Active
    objective: >
      Bind the assistant's FDC3 surface to the named demo intents and map
      each intent to an authority level on the ladder.
    statements:
      - id: apa-guidance-demo-intents.1
        title: Core allowlist
        text: >
          The assistant may raise demo.GetPortfolioRisk and
          demo.RunStressScenario at analyse, demo.GetResearch at explain,
          and demo.CreateOrderProposal at propose when the session
          entitlement and related controls are satisfied.
      - id: apa-guidance-demo-intents.2
        title: Execute ban
        text: >
          The assistant must not successfully raise demo.SubmitOrders.
          Governance must return DENY and the Desktop Agent must not
          forward the intent.
      - id: apa-guidance-demo-intents.3
        title: Responders
        text: >
          Risk App responds to GetPortfolioRisk and RunStressScenario;
          Research App to GetResearch; Order Entry to CreateOrderProposal;
          Execution / Order Entry would respond to SubmitOrders if it were
          permitted.
      - id: apa-guidance-demo-intents.4
        title: Optional View intents
        text: >
          Supporting View* intents (ViewInstrument, ViewChart, ViewNews,
          ViewResearch, ViewAnalysis, ViewHoldings, ViewOrders) may be
          allowlisted as low-authority UI helpers and must not grant propose
          or execute authority.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: proportional-authority
          - reference-id: prohibited-autonomous-execution
      - reference-id: AIR-PRIN
        entries:
          - reference-id: AIR-PRIN-005
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: authority-escalation
          - reference-id: execution-bypass
          - reference-id: tool-argument-injection

  - id: apa-guidance-fdc3-security
    title: FDC3 Security for Demo Contexts
    group: tool-use
    state: Active
    objective: >
      Require cryptographic provenance on demo suite contexts used as
      evidence for analysis, explanation, recommendation, and proposal.
    statements:
      - id: apa-guidance-fdc3-security.1
        title: Signed contexts
        text: >
          demo.portfolioRisk, demo.researchBundle, demo.stressScenarioResult,
          demo.portfolioRecommendation, and demo.orderProposal must be
          broadcast with FDC3 Security signatures.
      - id: apa-guidance-fdc3-security.2
        title: Unsigned handling
        text: >
          The assistant must not treat unsigned instances of those contexts
          as authoritative grounding for explain, recommend, or propose
          outputs.
      - id: apa-guidance-fdc3-security.3
        title: Evidence chain
        text: >
          Session logs should retain signature verification outcomes alongside
          the intent that produced or consumed the context.
    principles:
      - reference-id: apa-principles
        entries:
          - reference-id: deterministic-calculations
          - reference-id: evidence-of-authority-use
    vectors:
      - reference-id: apa-vectors
        entries:
          - reference-id: hallucinated-financial-claim
          - reference-id: overconfident-explanation
          - reference-id: tool-argument-injection
