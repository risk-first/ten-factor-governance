# Gemara GuidanceCatalog — ISO/IEC 27001:2022 (paraphrased structure)
# NOT ISO normative text. Licensed ISO/IEC 27001:2022 required for conformity.
# gemara-type: GuidanceCatalog

title: "ISO/IEC 27001:2022 Information Security Management Systems — Requirements"

metadata:
  id: iso-iec-27001-2022-guidance
  type: GuidanceCatalog
  version: "0.1.0"
  gemara-version: "1.2.0"
  draft: true
  date: "2026-09-06T00:00:00Z"
  author:
    id: local-adaptation
    name: "Local Gemara adaptation (paraphrase)"
    type: Human
  description: |
    Machine-readable Gemara GuidanceCatalog structurally aligned to ISO/IEC 27001:2022
    (third edition). Guideline IDs follow clause and Annex A control numbering.
    Statement text is a non-authoritative paraphrase for interoperability; it is not
    a substitute for a licensed copy of ISO/IEC 27001:2022 and does not reproduce ISO
    normative wording.

type: Standard

front-matter: |
  This catalog re-expresses the structure of ISO/IEC 27001:2022 as Gemara guidelines
  so that Governance Twins, controls, policies and evaluations can cite stable
  identifiers (for example iso27001-6.1.2 or iso27001-A.8.25).
  
  COPYRIGHT NOTICE: ISO/IEC 27001 is a copyrighted ISO/IEC publication. This file
  intentionally uses paraphrased objectives and statements rather than copying
  normative ISO text. For conformity assessment and audit, always consult a licensed
  copy of ISO/IEC 27001:2022 (and applicable amendments). Annex A control titles
  follow the publicly documented 2022 control set; control purposes here are concise
  paraphrases suitable for machine-readable mapping, not ISO control wording.
  
  Scope of this catalog: Clauses 4–10 management-system requirements and the 93
  Annex A reference controls. Clauses 1–3 (scope, normative references, terms) are
  omitted as they do not define operable guidelines.

groups:
  - id: context
    title: "Context of the organization"
    description: |
      Clause 4 — organisational context, interested parties, ISMS scope and the ISMS itself.

  - id: leadership
    title: "Leadership"
    description: |
      Clause 5 — leadership commitment, information security policy, and roles/responsibilities/authorities.

  - id: planning
    title: "Planning"
    description: |
      Clause 6 — risks and opportunities, risk assessment and treatment, objectives, and planned changes.

  - id: support
    title: "Support"
    description: |
      Clause 7 — resources, competence, awareness, communication and documented information.

  - id: operation
    title: "Operation"
    description: |
      Clause 8 — operational planning and control, and operational risk assessment and treatment.

  - id: performance-evaluation
    title: "Performance evaluation"
    description: |
      Clause 9 — monitoring/measurement, internal audit and management review.

  - id: improvement
    title: "Improvement"
    description: |
      Clause 10 — continual improvement and nonconformity/corrective action.

  - id: organisational
    title: "Annex A — Organisational controls"
    description: |
      Annex A theme: organisational information security controls (A.5.1–A.5.37).

  - id: people
    title: "Annex A — People controls"
    description: |
      Annex A theme: people controls (A.6.1–A.6.8).

  - id: physical
    title: "Annex A — Physical controls"
    description: |
      Annex A theme: physical controls (A.7.1–A.7.14).

  - id: technological
    title: "Annex A — Technological controls"
    description: |
      Annex A theme: technological controls (A.8.1–A.8.34).

exemptions:
  - description: "Clauses 1–3 (Scope, Normative references, Terms and definitions)"
    reason: |
      These clauses define document scope and vocabulary rather than operable ISMS
      guidelines; terms should live in a shared lexicon if needed.
  - description: "Detailed risk-methodology guidance"
    reason: |
      ISO/IEC 27005 elaborates risk assessment and treatment method detail; represent
      that as a companion GuidanceCatalog or RiskAssessment profile rather than
      expanding this catalog.
    redirect: "ISO/IEC 27005:2022"

guidelines:
  - id: iso27001-4.1
    title: "Understanding the organization and its context"
    group: context
    state: Active
    objective: |
      Determine internal and external issues relevant to the organisation's purpose and to achieving the intended outcomes of the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-4.1.1
        text: |
          Identify and maintain awareness of internal and external issues that affect information security and the ISMS.

  - id: iso27001-4.2
    title: "Understanding the needs and expectations of interested parties"
    group: context
    state: Active
    objective: |
      Identify interested parties relevant to the ISMS and determine which of their requirements are addressed through the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-4.2.1
        text: |
          Identify interested parties relevant to the ISMS.
      - id: iso27001-4.2.2
        text: |
          Determine which interested-party requirements are relevant to information security and will be addressed through the ISMS.

  - id: iso27001-4.3
    title: "Determining the scope of the information security management system"
    group: context
    state: Active
    objective: |
      Define and document the boundaries and applicability of the ISMS, considering organisational context, interested-party requirements and interfaces/dependencies.
    applicability:
      - isms
    statements:
      - id: iso27001-4.3.1
        text: |
          Determine the ISMS scope considering context, interested-party requirements and interfaces/dependencies with other organisations.
      - id: iso27001-4.3.2
        text: |
          Make the ISMS scope available as documented information.

  - id: iso27001-4.4
    title: "Information security management system"
    group: context
    state: Active
    objective: |
      Establish, implement, maintain and continually improve an ISMS in accordance with the requirements of ISO/IEC 27001.
    applicability:
      - isms
    statements:
      - id: iso27001-4.4.1
        text: |
          Establish, implement, maintain and continually improve the ISMS, including the processes needed and their interactions.

  - id: iso27001-5.1
    title: "Leadership and commitment"
    group: leadership
    state: Active
    objective: |
      Top management demonstrates leadership and commitment with respect to the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-5.1.1
        text: |
          Ensure the information security policy and objectives are established and compatible with the strategic direction of the organisation.
      - id: iso27001-5.1.2
        text: |
          Ensure ISMS requirements are integrated into the organisation's processes.
      - id: iso27001-5.1.3
        text: |
          Ensure resources needed for the ISMS are available.
      - id: iso27001-5.1.4
        text: |
          Communicate the importance of effective information security management and of conforming to ISMS requirements.
      - id: iso27001-5.1.5
        text: |
          Ensure the ISMS achieves its intended outcomes.
      - id: iso27001-5.1.6
        text: |
          Direct and support persons to contribute to the effectiveness of the ISMS.
      - id: iso27001-5.1.7
        text: |
          Promote continual improvement and support other relevant management roles.

  - id: iso27001-5.2
    title: "Policy"
    group: leadership
    state: Active
    objective: |
      Top management establishes an information security policy appropriate to the organisation's purpose.
    applicability:
      - isms
    statements:
      - id: iso27001-5.2.1
        text: |
          Establish an information security policy that is appropriate to the purpose of the organisation.
      - id: iso27001-5.2.2
        text: |
          Include a commitment to satisfy applicable information-security requirements.
      - id: iso27001-5.2.3
        text: |
          Include a commitment to continual improvement of the ISMS.
      - id: iso27001-5.2.4
        text: |
          Make the policy available as documented information, communicate it within the organisation, and make it available to interested parties as appropriate.

  - id: iso27001-5.3
    title: "Organizational roles, responsibilities and authorities"
    group: leadership
    state: Active
    objective: |
      Top management ensures that responsibilities and authorities for roles relevant to information security are assigned and communicated.
    applicability:
      - isms
    statements:
      - id: iso27001-5.3.1
        text: |
          Assign and communicate responsibilities and authorities for roles relevant to information security.
      - id: iso27001-5.3.2
        text: |
          Assign responsibility and authority for ensuring the ISMS conforms to ISO/IEC 27001 requirements.
      - id: iso27001-5.3.3
        text: |
          Assign responsibility and authority for reporting on ISMS performance to top management.

  - id: iso27001-6.1.1
    title: "Actions to address risks and opportunities — General"
    group: planning
    state: Active
    objective: |
      When planning the ISMS, determine risks and opportunities that need to be addressed so the ISMS can achieve intended outcomes, prevent undesired effects and achieve continual improvement.
    applicability:
      - isms
    statements:
      - id: iso27001-6.1.1.1
        text: |
          Determine risks and opportunities that need to be addressed for the ISMS.
      - id: iso27001-6.1.1.2
        text: |
          Plan actions to address these risks and opportunities.
      - id: iso27001-6.1.1.3
        text: |
          Plan how to integrate and implement the actions into ISMS processes, and how to evaluate their effectiveness.

  - id: iso27001-6.1.2
    title: "Information security risk assessment"
    group: planning
    state: Active
    objective: |
      Define and apply an information security risk assessment process that establishes risk criteria, ensures consistent and valid results, and identifies, analyses and evaluates information security risks.
    applicability:
      - isms
    statements:
      - id: iso27001-6.1.2.1
        title: "Risk criteria"
        text: |
          Establish and maintain information security risk criteria that include risk-acceptance criteria and criteria for performing assessments.
      - id: iso27001-6.1.2.2
        title: "Consistency"
        text: |
          Ensure that repeated assessments produce consistent, valid and comparable results.
      - id: iso27001-6.1.2.3
        title: "Risk identification"
        text: |
          Identify information security risks associated with loss of confidentiality, integrity and/or availability, and identify risk owners.
      - id: iso27001-6.1.2.4
        title: "Risk analysis"
        text: |
          Analyse risks by assessing potential consequences, realistic likelihood, and determining levels of risk.
      - id: iso27001-6.1.2.5
        title: "Risk evaluation"
        text: |
          Compare analysis results with risk criteria and prioritise analysed risks for treatment.
      - id: iso27001-6.1.2.6
        title: "Documented information"
        text: |
          Retain documented information about the information security risk assessment process.

  - id: iso27001-6.1.3
    title: "Information security risk treatment"
    group: planning
    state: Active
    objective: |
      Define and apply an information security risk treatment process that selects options, determines necessary controls, compares them with Annex A, produces a Statement of Applicability, formulates a treatment plan, and obtains risk-owner approval of residual risk.
    applicability:
      - isms
    recommendations:
      - "Represent the Statement of Applicability as an ApplicabilityProfile over Annex A guidelines."
      - "Map chosen controls to iso27001-A.* guideline IDs in this catalog."
    statements:
      - id: iso27001-6.1.3.1
        title: "Treatment options"
        text: |
          Select appropriate information security risk treatment options, taking account of assessment results.
      - id: iso27001-6.1.3.2
        title: "Necessary controls"
        text: |
          Determine all controls necessary to implement the chosen treatment options.
      - id: iso27001-6.1.3.3
        title: "Annex A comparison"
        text: |
          Compare necessary controls with those in Annex A and verify that no necessary controls have been omitted.
      - id: iso27001-6.1.3.4
        title: "Statement of Applicability"
        text: |
          Produce a Statement of Applicability that contains necessary controls, justification for inclusion, whether implemented, and justification for exclusions of Annex A controls.
      - id: iso27001-6.1.3.5
        title: "Treatment plan"
        text: |
          Formulate an information security risk treatment plan.
      - id: iso27001-6.1.3.6
        title: "Risk-owner approval"
        text: |
          Obtain risk owners' approval of the treatment plan and acceptance of residual information security risks.
      - id: iso27001-6.1.3.7
        title: "Documented information"
        text: |
          Retain documented information about the information security risk treatment process.

  - id: iso27001-6.2
    title: "Information security objectives and planning to achieve them"
    group: planning
    state: Active
    objective: |
      Establish information security objectives at relevant functions and levels that are consistent with the policy, measurable where practicable, monitored, communicated and updated.
    applicability:
      - isms
    statements:
      - id: iso27001-6.2.1
        text: |
          Establish information security objectives consistent with the information security policy.
      - id: iso27001-6.2.2
        text: |
          Ensure objectives are measurable (if practicable), take account of requirements and risk-assessment/treatment results, are monitored, communicated and updated as appropriate.
      - id: iso27001-6.2.3
        text: |
          When planning how to achieve objectives, determine what will be done, what resources will be required, who will be responsible, when it will be completed, and how results will be evaluated.
      - id: iso27001-6.2.4
        text: |
          Retain documented information on the information security objectives.

  - id: iso27001-6.3
    title: "Planning of changes"
    group: planning
    state: Active
    objective: |
      When the organisation determines the need for changes to the ISMS, the changes are carried out in a planned manner.
    applicability:
      - isms
    statements:
      - id: iso27001-6.3.1
        text: |
          Carry out changes to the ISMS in a planned manner.

  - id: iso27001-7.1
    title: "Resources"
    group: support
    state: Active
    objective: |
      Determine and provide the resources needed for the establishment, implementation, maintenance and continual improvement of the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-7.1.1
        text: |
          Determine and provide the resources needed for the ISMS.

  - id: iso27001-7.2
    title: "Competence"
    group: support
    state: Active
    objective: |
      Ensure persons doing work under the organisation's control that affects information-security performance are competent on the basis of appropriate education, training or experience.
    applicability:
      - isms
    statements:
      - id: iso27001-7.2.1
        text: |
          Determine the necessary competence of persons doing work under the organisation's control that affects its information security performance.
      - id: iso27001-7.2.2
        text: |
          Ensure these persons are competent on the basis of appropriate education, training or experience.
      - id: iso27001-7.2.3
        text: |
          Where applicable, take actions to acquire the necessary competence and evaluate the effectiveness of the actions taken.
      - id: iso27001-7.2.4
        text: |
          Retain appropriate documented information as evidence of competence.

  - id: iso27001-7.3
    title: "Awareness"
    group: support
    state: Active
    objective: |
      Persons doing work under the organisation's control are aware of the information security policy, their contribution to ISMS effectiveness, and implications of not conforming with ISMS requirements.
    applicability:
      - isms
    statements:
      - id: iso27001-7.3.1
        text: |
          Ensure relevant persons are aware of the information security policy.
      - id: iso27001-7.3.2
        text: |
          Ensure relevant persons are aware of their contribution to the effectiveness of the ISMS, including benefits of improved information security performance.
      - id: iso27001-7.3.3
        text: |
          Ensure relevant persons are aware of the implications of not conforming with the ISMS requirements.

  - id: iso27001-7.4
    title: "Communication"
    group: support
    state: Active
    objective: |
      Determine the need for internal and external communications relevant to the ISMS, including what, when, with whom, how and who communicates.
    applicability:
      - isms
    statements:
      - id: iso27001-7.4.1
        text: |
          Determine what to communicate, when to communicate, with whom to communicate, how to communicate, and who communicates, for communications relevant to the ISMS.

  - id: iso27001-7.5.1
    title: "Documented information — General"
    group: support
    state: Active
    objective: |
      The organisation's ISMS includes documented information required by ISO/IEC 27001 and documented information determined by the organisation as necessary for ISMS effectiveness.
    applicability:
      - isms
    statements:
      - id: iso27001-7.5.1.1
        text: |
          Include documented information required by ISO/IEC 27001.
      - id: iso27001-7.5.1.2
        text: |
          Include documented information determined by the organisation as being necessary for the effectiveness of the ISMS.

  - id: iso27001-7.5.2
    title: "Creating and updating"
    group: support
    state: Active
    objective: |
      When creating and updating documented information, ensure appropriate identification, format, and review and approval for suitability and adequacy.
    applicability:
      - isms
    statements:
      - id: iso27001-7.5.2.1
        text: |
          Ensure appropriate identification and description (for example title, date, author, reference number).
      - id: iso27001-7.5.2.2
        text: |
          Ensure appropriate format (for example language, software version, graphics) and media (for example paper, electronic).
      - id: iso27001-7.5.2.3
        text: |
          Ensure review and approval for suitability and adequacy.

  - id: iso27001-7.5.3
    title: "Control of documented information"
    group: support
    state: Active
    objective: |
      Control documented information required by the ISMS and by ISO/IEC 27001 to ensure it is available, suitable, and adequately protected.
    applicability:
      - isms
    statements:
      - id: iso27001-7.5.3.1
        text: |
          Ensure documented information is available and suitable for use, where and when it is needed.
      - id: iso27001-7.5.3.2
        text: |
          Ensure documented information is adequately protected (for example from loss of confidentiality, improper use, or loss of integrity).
      - id: iso27001-7.5.3.3
        text: |
          Address distribution, access, retrieval, use, storage, preservation, control of changes, retention and disposition as applicable.
      - id: iso27001-7.5.3.4
        text: |
          Identify and control documented information of external origin determined by the organisation to be necessary for the planning and operation of the ISMS.

  - id: iso27001-8.1
    title: "Operational planning and control"
    group: operation
    state: Active
    objective: |
      Plan, implement and control the processes needed to meet information-security requirements and to implement actions determined in Clause 6, including criteria, control of planned changes, and control of outsourced processes.
    applicability:
      - isms
    statements:
      - id: iso27001-8.1.1
        text: |
          Plan, implement and control processes needed to meet information security requirements and to implement Clause 6 actions.
      - id: iso27001-8.1.2
        text: |
          Establish criteria for the processes and implement control of the processes in accordance with the criteria.
      - id: iso27001-8.1.3
        text: |
          Keep documented information to the extent necessary to have confidence that processes have been carried out as planned.
      - id: iso27001-8.1.4
        text: |
          Control planned changes and review the consequences of unintended changes, taking action to mitigate adverse effects as necessary.
      - id: iso27001-8.1.5
        text: |
          Ensure that outsourced processes are determined and controlled.

  - id: iso27001-8.2
    title: "Information security risk assessment (operation)"
    group: operation
    state: Active
    objective: |
      Perform information security risk assessments at planned intervals and when significant changes are proposed or occur, retaining results of those assessments.
    applicability:
      - isms
    statements:
      - id: iso27001-8.2.1
        text: |
          Perform information security risk assessments at planned intervals.
      - id: iso27001-8.2.2
        text: |
          Perform information security risk assessments when significant changes are proposed or occur.
      - id: iso27001-8.2.3
        text: |
          Retain documented information of the results of the information security risk assessments.

  - id: iso27001-8.3
    title: "Information security risk treatment (operation)"
    group: operation
    state: Active
    objective: |
      Implement the information security risk treatment plan and retain documented information of the results of treatment.
    applicability:
      - isms
    statements:
      - id: iso27001-8.3.1
        text: |
          Implement the information security risk treatment plan.
      - id: iso27001-8.3.2
        text: |
          Retain documented information of the results of information security risk treatment.

  - id: iso27001-9.1
    title: "Monitoring, measurement, analysis and evaluation"
    group: performance-evaluation
    state: Active
    objective: |
      Determine what needs to be monitored and measured, the methods, when monitoring/measurement is performed, when results are analysed and evaluated, and evaluate information security performance and ISMS effectiveness.
    applicability:
      - isms
    statements:
      - id: iso27001-9.1.1
        text: |
          Determine what needs to be monitored and measured, including information security processes and controls.
      - id: iso27001-9.1.2
        text: |
          Determine the methods for monitoring, measurement, analysis and evaluation, as applicable, to ensure valid results.
      - id: iso27001-9.1.3
        text: |
          Determine when monitoring and measuring is performed, and when results are analysed and evaluated.
      - id: iso27001-9.1.4
        text: |
          Evaluate information security performance and the effectiveness of the ISMS.
      - id: iso27001-9.1.5
        text: |
          Retain appropriate documented information as evidence of the monitoring and measurement results.

  - id: iso27001-9.2.1
    title: "Internal audit — General"
    group: performance-evaluation
    state: Active
    objective: |
      Conduct internal audits at planned intervals to provide information on whether the ISMS conforms to the organisation's own requirements and to ISO/IEC 27001, and is effectively implemented and maintained.
    applicability:
      - isms
    statements:
      - id: iso27001-9.2.1.1
        text: |
          Conduct internal audits at planned intervals.
      - id: iso27001-9.2.1.2
        text: |
          Determine whether the ISMS conforms to the organisation's own requirements for its ISMS and to the requirements of ISO/IEC 27001.
      - id: iso27001-9.2.1.3
        text: |
          Determine whether the ISMS is effectively implemented and maintained.

  - id: iso27001-9.2.2
    title: "Internal audit programme"
    group: performance-evaluation
    state: Active
    objective: |
      Plan, establish, implement and maintain an audit programme including frequency, methods, responsibilities, planning requirements and reporting.
    applicability:
      - isms
    statements:
      - id: iso27001-9.2.2.1
        text: |
          Plan, establish, implement and maintain an audit programme including the frequency, methods, responsibilities, planning requirements and reporting.
      - id: iso27001-9.2.2.2
        text: |
          Take into consideration the importance of the processes concerned and the results of previous audits when establishing the audit programme.
      - id: iso27001-9.2.2.3
        text: |
          Define the audit criteria and scope for each audit.
      - id: iso27001-9.2.2.4
        text: |
          Select auditors and conduct audits that ensure objectivity and the impartiality of the audit process.
      - id: iso27001-9.2.2.5
        text: |
          Ensure that the results of the audits are reported to relevant management.
      - id: iso27001-9.2.2.6
        text: |
          Retain documented information as evidence of the implementation of the audit programme and the audit results.

  - id: iso27001-9.3.1
    title: "Management review — General"
    group: performance-evaluation
    state: Active
    objective: |
      Top management reviews the organisation's ISMS at planned intervals to ensure its continuing suitability, adequacy and effectiveness.
    applicability:
      - isms
    statements:
      - id: iso27001-9.3.1.1
        text: |
          Top management reviews the ISMS at planned intervals to ensure its continuing suitability, adequacy and effectiveness.

  - id: iso27001-9.3.2
    title: "Management review inputs"
    group: performance-evaluation
    state: Active
    objective: |
      Management review considers prior actions, changes in context and interested-party needs, information-security performance, risk results and improvement opportunities.
    applicability:
      - isms
    statements:
      - id: iso27001-9.3.2.1
        text: |
          Consider the status of actions from previous management reviews.
      - id: iso27001-9.3.2.2
        text: |
          Consider changes in external and internal issues relevant to the ISMS.
      - id: iso27001-9.3.2.3
        text: |
          Consider changes in needs and expectations of interested parties that are relevant to the ISMS.
      - id: iso27001-9.3.2.4
        text: |
          Consider information on information security performance, including nonconformities and corrective actions, monitoring and measurement results, audit results, and fulfilment of information security objectives.
      - id: iso27001-9.3.2.5
        text: |
          Consider feedback from interested parties.
      - id: iso27001-9.3.2.6
        text: |
          Consider results of risk assessment and status of the risk treatment plan.
      - id: iso27001-9.3.2.7
        text: |
          Consider opportunities for continual improvement.

  - id: iso27001-9.3.3
    title: "Management review results"
    group: performance-evaluation
    state: Active
    objective: |
      The results of the management review include decisions related to continual improvement opportunities and any need for changes to the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-9.3.3.1
        text: |
          Include decisions related to continual improvement opportunities.
      - id: iso27001-9.3.3.2
        text: |
          Include any need for changes to the ISMS.
      - id: iso27001-9.3.3.3
        text: |
          Retain documented information as evidence of the results of management reviews.

  - id: iso27001-10.1
    title: "Continual improvement"
    group: improvement
    state: Active
    objective: |
      Continually improve the suitability, adequacy and effectiveness of the ISMS.
    applicability:
      - isms
    statements:
      - id: iso27001-10.1.1
        text: |
          Continually improve the suitability, adequacy and effectiveness of the ISMS.

  - id: iso27001-10.2
    title: "Nonconformity and corrective action"
    group: improvement
    state: Active
    objective: |
      When a nonconformity occurs, react to it, evaluate the need for action to eliminate causes, implement needed action, review effectiveness, and make changes to the ISMS if necessary.
    applicability:
      - isms
    statements:
      - id: iso27001-10.2.1
        text: |
          React to the nonconformity and, as applicable, take action to control and correct it and deal with the consequences.
      - id: iso27001-10.2.2
        text: |
          Evaluate the need for action to eliminate the causes of the nonconformity so that it does not recur or occur elsewhere.
      - id: iso27001-10.2.3
        text: |
          Implement any action needed.
      - id: iso27001-10.2.4
        text: |
          Review the effectiveness of any corrective action taken.
      - id: iso27001-10.2.5
        text: |
          Make changes to the ISMS, if necessary.
      - id: iso27001-10.2.6
        text: |
          Ensure corrective actions are appropriate to the effects of the nonconformities encountered.
      - id: iso27001-10.2.7
        text: |
          Retain documented information as evidence of the nature of the nonconformities, subsequent actions taken, and results of corrective action.

