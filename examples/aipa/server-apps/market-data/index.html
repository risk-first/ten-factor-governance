<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIPA Market Data</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="toolbar ticker-bar">
          <div id="ticker-chips" class="ticker-chips" aria-label="Chart tickers"></div>
          <label class="add-ticker">
            <input id="ticker" value="SHEL" placeholder="Ticker" size="6" />
          </label>
          <button id="load" class="primary">Add</button>
        </div>
        <div class="chart-toolbar" id="chart-controls"></div>
        <div id="chart" class="chart-host" role="img" aria-label="OHLC chart"></div>
        <div id="table-view" class="table-host" hidden>
          <div id="bars-grid" class="ag-theme-quartz bars-grid" role="grid" aria-label="OHLC table"></div>
        </div>
      </div>
    </div>
  </body>
</html>
