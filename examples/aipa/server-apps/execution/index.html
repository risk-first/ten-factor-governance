<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIPA Execution</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="container">
      <div class="box execution-log">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="num-col">#</th>
                <th>Order</th>
                <th>Outcome</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody id="log"></tbody>
          </table>
        </div>
        <p id="log-empty" class="meta-row">No submissions yet.</p>
        <pre id="detail" class="code" hidden></pre>
      </div>
    </div>
  </body>
</html>
