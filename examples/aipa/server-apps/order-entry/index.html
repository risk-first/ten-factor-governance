<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIPA Order Entry</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="toolbar">
          <button id="demo-propose" class="primary">Create demo proposal</button>
          <button id="approve">Approve → broadcast orderList</button>
          <span id="verify" class="badge warn">Inbound signature: n/a</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Side</th>
              <th>Ticker</th>
              <th>Qty</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="blotter"></tbody>
        </table>
        <p id="blotter-empty" class="meta-row">No orders yet — create a demo proposal.</p>
      </div>
    </div>
  </body>
</html>
