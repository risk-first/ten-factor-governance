<svg class="diagram" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparative advantage Venn diagram">
  <circle cx="270" cy="180" r="140" fill="rgba(61,154,92,0.28)" stroke="#3d9a5c" stroke-width="2.5"/>
  <circle cx="450" cy="180" r="140" fill="rgba(243,239,228,0.08)" stroke="rgba(243,239,228,0.55)" stroke-width="2.5"/>
  <text x="200" y="175" text-anchor="middle" fill="#f3efe4" font-family="Source Serif 4, Georgia, serif" font-size="22">Humans</text>
  <text x="200" y="202" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">judgment, land,</text>
  <text x="200" y="220" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">accountability</text>
  <text x="360" y="175" text-anchor="middle" fill="#f3efe4" font-family="Source Serif 4, Georgia, serif" font-size="20">Overlap</text>
  <text x="360" y="202" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">comparative</text>
  <text x="360" y="220" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">advantage</text>
  <text x="520" y="175" text-anchor="middle" fill="#f3efe4" font-family="Source Serif 4, Georgia, serif" font-size="22">Machines</text>
  <text x="520" y="202" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">scale, speed,</text>
  <text x="520" y="220" text-anchor="middle" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="14">repetition</text>
</svg>
