<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15 — Demo apps</title>
  <link rel="stylesheet" href="../css/talk.css">
</head>
<body>
  <main class="stage">
    <article class="slide packed">
      <h1>The desk</h1>
      <div class="apps">
        <div class="app">
          <img class="app-icon" src="portfolio.svg" alt="">
          <strong>Portfolio</strong><span>Holdings and positions</span>
        </div>
        <div class="app">
          <img class="app-icon" src="risk.svg" alt="">
          <strong>Risk</strong><span>Stress and metrics</span>
        </div>
        <div class="app">
          <img class="app-icon" src="market-data.svg" alt="">
          <strong>Market Data</strong><span>Prices and charts</span>
        </div>
        <div class="app">
          <img class="app-icon" src="agent.svg" alt="">
          <strong>Agent</strong><span>Proposes actions</span>
        </div>
        <div class="app">
          <img class="app-icon" src="order-entry.svg" alt="">
          <strong>Order Entry</strong><span>Constructs the order</span>
        </div>
        <div class="app">
          <img class="app-icon" src="execution.svg" alt="">
          <strong>Execution</strong><span>Submits, if allowed</span>
        </div>
      </div>
      <footer class="chrome">
        <nav class="nav">
          <a class="prev" rel="prev" aria-label="Previous">←</a>
          <span class="num"></span>
          <a class="next" rel="next" aria-label="Next">→</a>
        </nav>
      </footer>
    </article>
  </main>
  <script src="../js/talk.js"></script>
</body>
</html>
