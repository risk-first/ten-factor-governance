<svg class="diagram" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cognitive Revolution Venn: a small human-mind economy beside a much larger human-plus-AI economy">
  <defs>
    <clipPath id="cog-before">
      <circle cx="200" cy="180" r="64"/>
    </clipPath>
    <clipPath id="cog-after">
      <circle cx="600" cy="180" r="152"/>
    </clipPath>
    <clipPath id="cog-human">
      <circle cx="600" cy="180" r="64"/>
    </clipPath>
  </defs>

  <circle cx="200" cy="180" r="64" fill="#2f7a48"/>
  <rect x="136" y="116" width="98.7" height="128" clip-path="url(#cog-before)" fill="#c6a15b"/>
  <circle cx="200" cy="180" r="64" fill="none" stroke="#8fd4a3" stroke-width="2.2"/>
  <line x1="234.7" y1="126.2" x2="234.7" y2="233.8" stroke="#f3efe4" stroke-width="1.8"/>
  <text x="118" y="176" text-anchor="end" fill="#f3efe4" font-family="Source Sans 3, sans-serif" font-size="15">Subsistence</text>
  <text x="118" y="194" text-anchor="end" fill="#f3efe4" font-family="Source Sans 3, sans-serif" font-size="15">cognition</text>
  <text x="282" y="176" text-anchor="start" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="15">Everything</text>
  <text x="282" y="194" text-anchor="start" fill="#b8c4b8" font-family="Source Sans 3, sans-serif" font-size="15">else</text>

  <circle cx="600" cy="180" r="152" fill="#2e3c32"/>
  <rect x="448" y="28" width="115.1" height="304" clip-path="url(#cog-after)" fill="#6a5a38"/>
  <circle cx="600" cy="180" r="64" fill="#2f7a48"/>
  <rect x="536" y="116" width="27.1" height="128" clip-path="url(#cog-human)" fill="#c6a15b"/>
  <circle cx="600" cy="180" r="64" fill="none" stroke="#8fd4a3" stroke-width="2.2"/>
  <circle cx="600" cy="180" r="152" fill="none" stroke="#d9d3c4" stroke-width="2.2"/>
  <line x1="563.1" y1="32.5" x2="563.1" y2="327.5" stroke="#f3efe4" stroke-width="1.8"/>
  <text x="610" y="174" text-anchor="middle" fill="#f3efe4" font-family="Source Serif 4, Georgia, serif" font-size="16">Human</text>
  <text x="610" y="192" text-anchor="middle" fill="#f3efe4" font-family="Source Serif 4, Georgia, serif" font-size="16">component</text>
  <text x="708" y="174" text-anchor="middle" fill="#d9d3c4" font-family="Source Sans 3, sans-serif" font-size="15">AI</text>
  <text x="708" y="192" text-anchor="middle" fill="#d9d3c4" font-family="Source Sans 3, sans-serif" font-size="15">component</text>
</svg>
